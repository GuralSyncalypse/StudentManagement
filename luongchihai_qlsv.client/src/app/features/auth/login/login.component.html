<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-100 transition-all duration-300 hover:shadow-2xl">

        <div class="text-center mb-8">
            <div class="text-5xl mb-3 inline-block animate-bounce duration-1000">🏫</div>
            <h2 class="text-2xl font-bold text-slate-800 tracking-wide uppercase">PORTAL ĐĂNG NHẬP</h2>
            <p class="text-xs text-slate-500 mt-2 font-medium tracking-normal">Hệ Thống Quản Lý Sinh Viên & Kết Quả Học Tập</p>
        </div>

        <div *ngIf="errorMessage" class="flex items-center gap-2 mb-6 p-4 text-sm text-red-800 rounded-xl bg-red-50 border border-red-100 font-medium animate-fade-in">
            <span class="text-base">⚠️</span>
            <span>{{ errorMessage }}</span>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off" class="space-y-5">

            <div class="flex flex-col gap-1.5">
                <label for="username" class="text-xs font-semibold text-slate-700 uppercase tracking-wider">Tên đăng nhập</label>
                <input type="text"
                       id="username"
                       formControlName="username"
                       placeholder="Nhập tên tài khoản..."
                       class="w-full px-4 py-3 rounded-xl border text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 transition-all duration-150"
                       [ngClass]="(loginForm.get('username')?.invalid && loginForm.get('username')?.touched)
                                  ? 'border-red-500 focus:ring-red-200'
                                  : 'border-slate-200 focus:ring-blue-100 focus:border-blue-500'" />

                <span class="text-xs text-red-500 mt-0.5 font-medium flex items-center gap-1"
                      *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
                    <span>•</span> Tên đăng nhập không được để trống.
                </span>
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="passwordHash" class="text-xs font-semibold text-slate-700 uppercase tracking-wider">Mật khẩu</label>
                <input type="password"
                       id="passwordHash"
                       formControlName="password"
                       placeholder="Nhập mật khẩu..."
                       class="w-full px-4 py-3 rounded-xl border text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 transition-all duration-150"
                       [ngClass]="(loginForm.get('password')?.invalid && loginForm.get('password')?.touched)
                                  ? 'border-red-500 focus:ring-red-200'
                                  : 'border-slate-200 focus:ring-blue-100 focus:border-blue-500'" />

                <span class="text-xs text-red-500 mt-0.5 font-medium flex items-center gap-1"
                      *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                    <span>•</span> Mật khẩu bắt buộc và phải từ 4 ký tự trở lên.
                </span>
            </div>

            <button type="submit"
                    [disabled]="loginForm.invalid || isLoading"
                    class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-500/20 hover:shadow-none transition-all duration-200 flex justify-center items-center gap-2">

                <span *ngIf="!isLoading" class="tracking-wider">ĐĂNG NHẬP</span>

                <span *ngIf="isLoading" class="flex items-center gap-2">
                    <svg class="animate-spin h-5 w-5 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Đang xác thực hệ thống...</span>
                </span>
            </button>

        </form>
    </div>
</div>

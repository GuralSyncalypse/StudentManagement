<div class="app-layout">
  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="brand">
      <span class="logo-icon">🎓</span>
      <h2>EduPortal</h2>
    </div>

    <nav class="nav-menu">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <span class="icon">📊</span> Dashboard
      </a>
      <a routerLink="/courses" routerLinkActive="active" class="nav-item">
        <span class="icon">📚</span> My Courses
      </a>
      <a routerLink="/profile" routerLinkActive="active" class="nav-item">
        <span class="icon">👤</span> Profile
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout">Logout</button>
    </div>
  </aside>

  <!-- Main App Content Space -->
  <div class="main-wrapper">
    <!-- Top Global Navbar -->
    <header class="top-navbar">
      <div class="search-bar">
        <input type="text" placeholder="Search courses, assignments..." />
      </div>
      <div class="user-actions">
        <span class="notification-bell">🔔</span>
        <div class="user-badge">AM</div>
      </div>
    </header>

    <!-- Dynamic Content Injection Point -->
    <main class="content-body">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<div class="flex min-h-screen bg-slate-50">
    <aside class="w-64 bg-slate-900 text-slate-100 flex flex-col justify-between border-r border-slate-800 shrink-0">
        <div class="flex flex-col gap-6 p-5">
            <div class="flex items-center gap-3">
                <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-sm shadow-md shadow-indigo-600/20">
                    EP
                </span>
                <h1 class="text-base font-semibold tracking-wide text-white">EduPortal Admin</h1>
            </div>

            <nav class="flex flex-col gap-1.5">
                <a routerLink="/admin/dashboard"
                   routerLinkActive="bg-slate-800 text-white font-semibold"
                   [routerLinkActiveOptions]="{ exact: true }"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-all duration-200 text-sm font-medium">
                    <i class="fa-solid fa-chart-line w-4 text-center"></i>
                    Dashboard
                </a>

                <details class="group [&_summary::-webkit-details-marker]:hidden">
                    <summary class="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white cursor-pointer transition-all duration-200 text-sm font-medium list-none">
                        <span class="flex items-center gap-3">
                            <i class="fa-solid fa-book w-4 text-center"></i>
                            <span>Đào tạo</span>
                        </span>
                        <span class="shrink-0 transition duration-300 group-open:-rotate-180">
                            <i class="fa-solid fa-chevron-down text-[10px]"></i>
                        </span>
                    </summary>

                    <div class="mt-1 pl-9 flex flex-col gap-1 border-l border-slate-800 ml-5">
                        <a routerLink="/admin/semesters"
                           routerLinkActive="text-indigo-400 font-semibold"
                           class="block py-2 text-sm text-slate-400 hover:text-white transition-colors duration-150">
                            Học kỳ
                        </a>
                        <a routerLink="/admin/courses"
                           routerLinkActive="text-indigo-400 font-semibold"
                           class="block py-2 text-sm text-slate-400 hover:text-white transition-colors duration-150">
                            Học phần
                        </a>
                        <a routerLink="/admin/courseSections"
                           routerLinkActive="text-indigo-400 font-semibold"
                           class="block py-2 text-sm text-slate-400 hover:text-white transition-colors duration-150">
                            Lớp học phần
                        </a>
                        <a routerLink="/admin/enrollments"
                           routerLinkActive="text-indigo-400 font-semibold"
                           class="block py-2 text-sm text-slate-400 hover:text-white transition-colors duration-150">
                            Chấm điểm
                        </a>
                    </div>
                </details>

                <a routerLink="/admin/users"
                   routerLinkActive="bg-slate-800 text-white font-semibold"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-all duration-200 text-sm font-medium">
                    <i class="fa-solid fa-user-gear w-4 text-center"></i>
                    Tài khoản
                </a>
                <a routerLink="/admin/permissions"
                   routerLinkActive="bg-slate-800 text-white font-semibold"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-all duration-200 text-sm font-medium">
                    <i class="fa-solid fa-shield-halved w-4 text-center"></i>
                    Phân quyền role
                </a>
                <a routerLink="/admin/userPermissions"
                   routerLinkActive="bg-slate-800 text-white font-semibold"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-all duration-200 text-sm font-medium">
                    <i class="fa-solid fa-user-shield w-4 text-center"></i>
                    Phân quyền user
                </a>
                <a routerLink="/admin/students"
                   routerLinkActive="bg-slate-800 text-white font-semibold"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-all duration-200 text-sm font-medium">
                    <i class="fa-solid fa-graduation-cap w-4 text-center"></i>
                    Sinh viên
                </a>
                <a routerLink="/admin/reports"
                   routerLinkActive="bg-slate-800 text-white font-semibold"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-all duration-200 text-sm font-medium">
                    <i class="fa-solid fa-chart-pie w-4 text-center"></i>
                    Báo cáo
                </a>
            </nav>
        </div>

        <div class="p-5 border-t border-slate-800 flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-semibold text-sm shrink-0 border border-indigo-500/30">
                A
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-white truncate">Quản trị viên</p>
                <button (click)="onLogout()" class="text-xs text-slate-400 hover:text-rose-400 transition-colors duration-150 p-0 bg-transparent border-0 cursor-pointer block mt-0.5">
                    Đăng xuất
                </button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-x-hidden">
        <header class="h-16 border-b border-slate-200 bg-white px-6 flex items-center justify-between shrink-0">
            <div class="flex items-center">
                <div class="space-y-0.5">
                    <h2 class="text-base font-semibold text-slate-950">Bảng điều khiển</h2>
                    <p class="text-xs text-slate-500">Quản lý sinh viên, học phần và đăng ký học tập</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <span class="text-xs text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg font-medium border border-slate-200/50">
                    {{ todayLabel }}
                </span>
                <div class="relative">
                    <span class="absolute -top-1 -right-1 w-4 h-4 bg-rose-500 text-white rounded-full text-[10px] flex items-center justify-center font-bold ring-2 ring-white">
                        3
                    </span>
                    <button class="w-9 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-base transition-colors duration-150 text-slate-700" type="button" aria-label="Thông báo">
                        🔔
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-1 p-6 overflow-y-auto">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>

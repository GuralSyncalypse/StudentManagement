<div class="admin-container">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <span class="brand-icon">EP</span>
        <h1 class="brand-title">EduPortal Admin</h1>
      </div>

      <nav class="sidebar-menu">
          <a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>

          <details>
              <summary>
                  <i class="fa-solid fa-book"></i>
                  Đào tạo
              </summary>
              <a routerLink="/admin/courses">Học phần</a>
              <a routerLink="/admin/courseSections">Lớp học phần</a>
              <a routerLink="/admin/enrollments">Chấm điểm</a>
          </details>

          <a routerLink="/admin/users">Tài khoản</a>
          <a routerLink="/admin/permissions">Phân quyền role</a>
          <a routerLink="/admin/students">Sinh viên</a>

          <a routerLink="/admin/reports">Báo cáo</a>
      </nav>
    </div>

    <div class="sidebar-profile">
      <div class="avatar">A</div>
      <div class="profile-info">
        <p class="profile-name">Quản trị viên</p>
        <button (click)="onLogout()" class="logout-btn">Đăng xuất</button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <div class="space-y-1">
          <h2 class="page-title">Bảng điều khiển</h2>
          <p class="text-xs text-slate-500">Quản lý sinh viên, học phần và đăng ký học tập</p>
        </div>
      </div>

      <div class="topbar-right">
        <span class="topbar-date">{{ todayLabel }}</span>
        <div class="notification-wrapper">
          <span class="notification-badge">3</span>
          <button class="notification-btn" type="button" aria-label="Thông báo">🔔</button>
        </div>
      </div>
    </header>

    <router-outlet></router-outlet>
  </main>
</div>
